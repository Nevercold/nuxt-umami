name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm dev:prepare
      - run: pnpm lint
      - run: pnpm test:types
      - run: pnpm test
      # npm authenticates through OIDC (trusted publishing), no token needed
      - name: publish
        run: |
          version=$(node -p "require('./package.json').version")
          if npm view "nuxt-umami-plugin@$version" version >/dev/null 2>&1; then
            echo "$version is already on npm, skipping"
          else
            npm publish --access public
          fi
      - run: npx changelogen gh release ${{ github.ref_name }} --token ${{ secrets.GITHUB_TOKEN }}
